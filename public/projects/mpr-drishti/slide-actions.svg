<text x="212.0" y="448.0" font-size="19" fill="#0b0b0b" font-weight="600" text-anchor="start" >Unit B decided a smaller share of its cases than last year</text>
<text x="212.0" y="480.0" font-size="15" fill="#52514e" font-weight="400" text-anchor="start" >Disposal rate down from 72% to 66%, while the zone as a whole improved by 4 points.</text>
<text x="1204.0" y="448.0" font-size="15" fill="#898781" font-weight="600" text-anchor="end" >3</text>
<rect x="56.0" y="522.0" width="1168.0" height="104.0" rx="12" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
