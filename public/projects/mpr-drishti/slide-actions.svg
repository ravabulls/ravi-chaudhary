<rect x="76.0" y="308.0" width="112.0" height="30.0" rx="15" fill="#fbe4e4" />
<circle cx="94" cy="323" r="5" fill="#d03b3b"/>
<text x="106.0" y="328.0" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >High</text>
<text x="212.0" y="330.0" font-size="19" fill="#0b0b0b" font-weight="600" text-anchor="start" >Unit D: 39% of pending cases are more than a year old</text>
<text x="212.0" y="362.0" font-size="15" fill="#52514e" font-weight="400" text-anchor="start" >The zone figure is 31%. Older cases are harder to decide and harder to recover.</text>
<text x="1204.0" y="330.0" font-size="15" fill="#898781" font-weight="600" text-anchor="end" >2</text>
<rect x="56.0" y="404.0" width="1168.0" height="104.0" rx="12" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
