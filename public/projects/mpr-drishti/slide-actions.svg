<text x="212.0" y="566.0" font-size="19" fill="#0b0b0b" font-weight="600" text-anchor="start" >Demand confirmed at adjudication is below All India</text>
<text x="212.0" y="598.0" font-size="15" fill="#52514e" font-weight="400" text-anchor="start" >58 of every 100 rupees demanded were confirmed, against 63 for All India.</text>
<text x="1204.0" y="566.0" font-size="15" fill="#898781" font-weight="600" text-anchor="end" >4</text>
