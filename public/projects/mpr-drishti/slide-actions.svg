<text x="1093.0" y="56.0" font-size="11.5" fill="#6b4a00" font-weight="700" text-anchor="middle" letter-spacing="0.8">SAMPLE DATA · INVENTED FIGURES</text>
<text x="56.0" y="104.0" font-size="30" fill="#0b0b0b" font-weight="600" text-anchor="start" >Four points for attention, ranked by severity</text>
<text x="56.0" y="136.0" font-size="16" fill="#52514e" font-weight="400" text-anchor="start" >Raised only when the figures show them; each says what to look at and why</text>
<rect x="56.0" y="168.0" width="1168.0" height="104.0" rx="12" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
