<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mock-up of a points-for-attention slide with invented figures: four action points ranked High, Medium and Low.">
<title>Mock-up of a points-for-attention slide with invented figures: four action points ranked High, Medium and Low.</title>
