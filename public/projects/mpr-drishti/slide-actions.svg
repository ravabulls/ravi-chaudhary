<text x="106.0" y="210.0" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >High</text>
<text x="212.0" y="212.0" font-size="19" fill="#0b0b0b" font-weight="600" text-anchor="start" >Unit G: 12 cases reach their legal time limit within 3 months</text>
<text x="212.0" y="244.0" font-size="15" fill="#52514e" font-weight="400" text-anchor="start" >Decide them or record the reasons first. Across the zone, 19 cases are this close to the limit.</text>
<text x="1204.0" y="212.0" font-size="15" fill="#898781" font-weight="600" text-anchor="end" >1</text>
